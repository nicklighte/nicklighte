<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Agribusiness - Contact Us</title>
    <link rel="icon" href="images/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
    <header class="navbar" id="site-header"></header>

    <main class="main-container">
        <h1 class="page-title">Contact Us</h1>
        <div class="contact-layout">
            <div class="form-card">
                <h2 class="sub first">Send us a message</h2>
                <div id="sent" class="alert alert-ok" role="status" hidden></div>
                <form id="contactForm" novalidate>
                    <div class="field">
                        <label for="name">Your Name</label>
                        <input type="text" id="name" name="name" placeholder="Enter your name" required minlength="2" maxlength="80" autocomplete="name">
                    </div>
                    <div class="field">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required maxlength="120" autocomplete="email">
                    </div>
                    <div class="field">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" placeholder="Type your message here..." rows="4" required minlength="10" maxlength="2000"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" id="sendBtn">Send Message</button>
                </form>
            </div>
            <div class="side-card">
                <h3>Get in Touch</h3>
                <p><strong>Location:</strong> Ruiru, Kiambu County</p>
                <p><strong>Phone:</strong> +254 700 000 000</p>
                <p><strong>Email:</strong> support@greenagribusiness.co.ke</p>
            </div>
        </div>
    </main>

    <footer class="footer" id="site-footer"></footer>
    <script src="script.js"></script>
    <script>
        const form = document.getElementById('contactForm');
        const EMAIL = /^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$/;

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(form));
            // Browser-side checks (the server checks again, because browser checks can be bypassed)
            const problems = {};
            if (data.name.trim().length < 2) problems.name = 'Enter your name.';
            if (!EMAIL.test(data.email.trim())) problems.email = 'Enter a valid email address.';
            if (data.message.trim().length < 10) problems.message = 'Write at least 10 characters.';
            if (Object.keys(problems).length) { showFormErrors(form, null, problems); return; }

            const btn = document.getElementById('sendBtn');
            btn.disabled = true;
            try {
                const res = await api('/contact', { method: 'POST', body: data });
                clearFormErrors(form);
                form.reset();
                const ok = document.getElementById('sent');
                ok.textContent = res.message;
                ok.hidden = false;
            } catch (err) {
                showFormErrors(form, err.message, err.details);
            } finally {
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
